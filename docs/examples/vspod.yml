# Copy to .vspod/vspod.yml to activate for this repository.
schemaVersion: 1
name: vspod

extensions:
  required:
    - redhat.vscode-yaml
    - tamasfe.even-better-toml

  # Select with `vspod extensions sync --include-optional` while stopped.
  optional:
    - swiftlang.swift-vscode
    - rust-lang.rust-analyzer
    - ms-python.python
    - detachhead.basedpyright
    - llvm-vs-code-extensions.vscode-clangd
    - timonwong.shellcheck
    - foxundermoon.shell-format
    - ms-azuretools.vscode-docker
    - esbenp.prettier-vscode

# TypeScript/JavaScript, JSON, HTML, CSS and Markdown support is built into VS Code.
# Extensions do not provision Swift/SourceKit-LSP, Rust/Cargo, clangd or Python.
# AppKit, Metal, Keychain and Tauri macOS builds still require the host's Xcode tools.
# Docker tooling does not grant access to the host Docker socket.
settings:
  editor.tabSize: 2
  editor.insertSpaces: true
  editor.detectIndentation: true
  editor.formatOnSave: false
  files.insertFinalNewline: true

# No account requirements or automatic startup tasks: login does not grant container
# credentials, and installing build dependencies should be an explicit operation.
