[package]
name = "vspod-compositor"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
debug = false
lto = "thin"
